name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run unit tests
        working-directory: backend
        run: npm run test

  deploy:
    name: Deploy to EC2
    runs-on: [self-hosted, ai-pdf]
    needs: test
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        working-directory: backend
        run: |
          cat > .env << EOF
          AWS_REGION=${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
          DYNAMODB_USERS_TABLE=${{ secrets.DYNAMODB_USERS_TABLE }}
          DYNAMODB_FILES_TABLE=${{ secrets.DYNAMODB_FILES_TABLE }}
          PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX=${{ secrets.PINECONE_INDEX }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          PORT=${{ secrets.PORT }}
          EOF

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Sync to production directory
        run: |
          rsync -av --delete \
            backend/dist/ /var/www/backend/dist/
          rsync -av \
            backend/.env \
            backend/package.json \
            backend/package-lock.json \
            /var/www/backend/

      - name: Install production dependencies
        run: |
          cd /var/www/backend
          npm ci --omit=dev

      - name: Restart PM2
        run: |
          cd /var/www/backend
          if pm2 describe document-search > /dev/null 2>&1; then
            pm2 restart document-search
          else
            pm2 start dist/main.js --name document-search
          fi
          pm2 save

      - name: Verify
        run: pm2 show document-search | grep online

